# Render Blueprint — deploys Qene as a free static site.
# https://render.com/docs/blueprint-spec
#
# Two ways to use this:
#   1. Push this repo to GitHub, then in the Render dashboard choose
#      "New" -> "Blueprint" and point it at the repo. Render reads this
#      file automatically and creates the service below.
#   2. Or skip the blueprint entirely and create a "Static Site" by hand
#      in the dashboard with the same buildCommand / publish path — the
#      blueprint just saves you from typing those in twice (and keeps them
#      version-controlled).
#
# There's no backend/API in this app yet (progress is localStorage-only),
# so a single static-site service is all that's needed for now. When the
# accounts/sync backend gets added, that becomes a second `runtime: node`
# (or similar) service in this same file.

services:
  - type: web
    name: qene
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20
    # The app is a single entry point (no client-side router, no deep
    # links) — everything happens as in-memory screen state inside one
    # index.html. This rewrite is here anyway as cheap insurance for if/when
    # routing gets added later; it's a no-op today.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
